# 发布流程：打 v* tag 触发 → npm pack（prepack 复制 assets）→ GitHub Release → npm publish
# v3 不再发布 vsix / Open VSX。

name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # npm Trusted Publishing 需要 OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm --version

      # 清掉任何可能让 npm CLI 走 token 鉴权的环境
      - run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "WARNING: NODE_AUTH_TOKEN was set; unsetting for OIDC"
          fi
          { echo "NODE_AUTH_TOKEN="; } >> "$GITHUB_ENV"
          rm -f "$HOME/.npmrc" || true

      - name: Pack npm tarball
        working-directory: packages/cli
        run: |
          set -euo pipefail
          node --check index.js
          npm pack
          TARBALL=$(ls parallelagent-*.tgz | head -n1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Delete existing release if any
        run: gh release delete "${{ github.ref_name }}" -y || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" "packages/cli/$TARBALL" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: packages/cli
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "parallelagent@$VERSION" version >/dev/null 2>&1; then
            echo "parallelagent@$VERSION 已发布，跳过"
          else
            npm publish --access public --provenance --registry https://registry.npmjs.org/
          fi
